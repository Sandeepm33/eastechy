    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Immediate theme initializer script to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eastechy_theme') || localStorage.getItem('shiftwave_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#121214] text-[#444] dark:text-[#ddd] font-poppins selection:bg-[#2563EB] selection:text-white transition-colors duration-300">

    <script type="module" src="/src/main.tsx"></script>
  </body>
